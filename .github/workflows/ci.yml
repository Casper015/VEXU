name: VEX CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate All VEX Projects
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JSON configurations
        shell: bash
        run: |
          echo "=== Checking JSON files ==="
          python3 -c '
          import json, pathlib, sys
          bad = 0
          for p in pathlib.Path(".").rglob("*.json"):
              if any(x.startswith(".") for x in p.parts if x != ".vscode"):
                  continue
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  print(f"::error file={p}::Invalid JSON: {e}")
                  bad += 1
          if bad > 0:
              sys.exit(1)
          '
          echo "All JSON files are valid."

      - name: Discover and validate all VEX projects
        shell: bash
        run: |
          echo "=== Discovering all VEX projects ==="
          projects=()
          while IFS= read -r -d '' mf; do
            pdir=$(dirname "$mf")
            projects+=("$pdir")
          done < <(find . -type f -name "makefile" -not -path "*/.*/*" -print0 | sort -z)

          if [ ${#projects[@]} -eq 0 ]; then
            echo "::error::No VEX projects found with makefile!"
            exit 1
          fi

          echo "Found ${#projects[@]} project(s):"
          for p in "${projects[@]}"; do
            echo "  - $p"
          done

          failed=0
          for p in "${projects[@]}"; do
            echo "----------------------------------------------------"
            echo "Validating project: $p"
            
            # 1. Directory & files structure check
            if [ ! -d "$p/src" ] || [ ! -d "$p/include" ] || [ ! -f "$p/vex/mkenv.mk" ] || [ ! -f "$p/vex/mkrules.mk" ]; then
              echo "::error file=$p::Project structure validation failed for $p (missing src, include, or vex/mk*)"
              failed=1
              continue
            fi
            
            # 2. Dry-run VEX build
            echo "Running dry-run build: make -C \"$p\" -n all"
            if ! make -C "$p" -n all > /dev/null; then
              echo "::error file=$p::Build dry-run failed for $p"
              failed=1
              continue
            fi
            
            echo "PASS: $p"
          done

          if [ $failed -ne 0 ]; then
            echo "One or more projects failed validation."
            exit 1
          fi

          echo "All ${#projects[@]} projects validated successfully!"

